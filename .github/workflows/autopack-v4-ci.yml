name: AutoPack v4 CI

on:
  push:
    paths:
      - 'autopack-v4/**'
      - '.github/workflows/autopack-v4*.yml'
  pull_request:
    paths:
      - 'autopack-v4/**'
      - '.github/workflows/autopack-v4*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Testar motor
        run: python -m unittest discover -s autopack-v4/tests -v
      - name: Validar os 600 controles rastreaveis
        run: python autopack-v4/catalog.py --check
      - name: Validar scripts shell
        run: bash -n autopack-v4/*.sh
      - name: Validar YAML dos workflows
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python - <<'PY'
          from pathlib import Path
          import yaml

          for workflow in sorted(Path('.github/workflows').glob('autopack-v4*.yml')):
              with workflow.open(encoding='utf-8') as stream:
                  yaml.safe_load(stream)
              print(f'YAML valido: {workflow}')
          PY

  powershell-syntax:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validar scripts PowerShell
        shell: pwsh
        run: |
          $errors = @()
          $scripts = @(Get-ChildItem autopack-v4 -Filter *.ps1 -File -Recurse)
          if (-not $scripts.Count) { throw 'Nenhum script PowerShell encontrado para validar.' }
          $scripts | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors.Count) { $errors | Format-List; throw 'Scripts PowerShell invalidos.' }
      - name: Testar geracao MSI no Windows PowerShell 5.1
        shell: powershell
        run: ./autopack-v4/tests/test_package_msi.ps1
      - name: Testar geracao MSI no PowerShell moderno
        shell: pwsh
        run: ./autopack-v4/tests/test_package_msi.ps1

  msi-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Instalar WiX real
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          Join-Path $env:USERPROFILE '.dotnet\tools' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Instalar, executar, atualizar, reparar e remover MSI
        shell: powershell
        run: ./autopack-v4/tests/test_msi_lifecycle.ps1
      - name: Preservar MSI, checksums e logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MSI-lifecycle-${{ github.run_id }}
          path: msi-test-results/
          if-no-files-found: warn
